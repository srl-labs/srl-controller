---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: srlinuxes.kne.srlinux.dev
spec:
  group: kne.srlinux.dev
  names:
    kind: Srlinux
    listKind: SrlinuxList
    plural: srlinuxes
    singular: srlinux
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.image
      name: Image
      type: string
    - jsonPath: .status.status
      name: Status
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.startup-config.phase
      name: Config
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: Srlinux is the Schema for the srlinuxes API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          license_key:
            description: license key from license secret that contains a license file
              for this Srlinux
            type: string
          metadata:
            type: object
          spec:
            description: SrlinuxSpec defines the desired state of Srlinux.
            properties:
              components:
                description: |-
                  Components lists the line cards installed in the chassis. When set, the slot
                  configuration of the model's topology template is replaced with these components.
                  When empty, the model's topology template is used unchanged.
                items:
                  description: Component is a line card installed in a chassis slot.
                  properties:
                    slot:
                      description: Slot is the chassis slot number the line card is
                        installed in.
                      format: int32
                      minimum: 1
                      type: integer
                    type:
                      description: |-
                        Type is the line card (IMM) model. When empty, the line card of the lowest
                        numbered slot in the model's topology template is used.
                      enum:
                      - imm2-36-400g-sync-qsfpdd
                      - imm3-18-800g-qsfpdd
                      - imm3-36-800g-osfp
                      - imm3-36-800g-qsfpdd
                      - imm3-36-800g-sync-qsfpdd
                      - imm36-400g-qsfpdd
                      - imm60-100g-qsfp28
                      type: string
                  required:
                  - slot
                  type: object
                maxItems: 128
                type: array
                x-kubernetes-list-map-keys:
                - slot
                x-kubernetes-list-type: map
              config:
                description: NodeConfig represents srlinux node configuration parameters.
                properties:
                  args:
                    description: Command args to pass into the pod.
                    items:
                      type: string
                    type: array
                  cert:
                    description: CertificateCfg represents srlinux certificate configuration
                      parameters.
                    properties:
                      cert_name:
                        description: Certificate name on the node.
                        type: string
                      common_name:
                        description: Common name to set in the cert.
                        type: string
                      key_name:
                        description: Key name on the node.
                        type: string
                      key_size:
                        description: RSA keysize to use for key generation.
                        format: int32
                        type: integer
                    type: object
                  command:
                    description: Command to pass into pod.
                    items:
                      type: string
                    type: array
                  config_data_present:
                    description: When set to true by kne, srlinux controller will
                      attempt to mount the file with startup config to the pod
                    type: boolean
                  config_file:
                    description: Startup configuration file name for the pod. Set
                      in the kne topo and created by kne as a config map
                    type: string
                  config_path:
                    description: Mount point for configuration inside the pod. Should
                      point to a dir that contains ConfigFile
                    type: string
                  entry_command:
                    description: Specific entry point command for accessing the pod.
                    type: string
                  env:
                    additionalProperties:
                      type: string
                    description: Map of environment variables to pass into the pod.
                    type: object
                  image:
                    description: Container image to use with for the SR Linux container.
                    type: string
                  init-image:
                    description: Init container image to use with for the SR Linux
                      container.
                    type: string
                  sleep:
                    description: Sleep time before starting the pod.
                    format: int32
                    type: integer
                type: object
              constraints:
                additionalProperties:
                  type: string
                type: object
              model:
                description: Model encodes SR Linux variant (ixr-d3, ixr-6e, etc)
                type: string
              num-interfaces:
                type: integer
              version:
                description: |-
                  Version may be set in kne topology as a mean to explicitly provide version information
                  in case it is not encoded in the image tag
                type: string
            type: object
            x-kubernetes-validations:
            - message: components are only supported on models ixr6 and ixr6e (slots
                1-4) and ixr10 and ixr10e (slots 1-8)
              rule: '!has(self.components) || self.components.all(c, c.slot <= {''ixr6'':
                4, ''ixr6e'': 4, ''ixr10'': 8, ''ixr10e'': 8}[?self.?model.orValue('''')].orValue(0))'
          status:
            description: SrlinuxStatus defines the observed state of Srlinux.
            properties:
              image:
                description: Image used to run srlinux pod
                type: string
              ready:
                description: |-
                  Ready is true if the srlinux NOS is ready to receive config.
                  This is when management server is running and initial commit is processed.
                type: boolean
              startup-config:
                description: StartupConfig contains the status of the startup-config.
                properties:
                  phase:
                    description: 'Phase is the phase startup-config is in. Can be
                      one of: "pending", "loaded", "not-provided", "failed".'
                    type: string
                type: object
              status:
                description: |-
                  Status is the status of the srlinux custom resource.
                  Can be one of: "created", "running", "error".
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
